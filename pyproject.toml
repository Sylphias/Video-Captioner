[project]
name = "eigen-video-editor-scripts"
version = "0.1.0"
description = "Python scripts for transcription and speaker diarization"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "whisperx",
    "pyannote-audio>=4.0.4",
    "soundfile>=0.13.1",
]

[tool.uv]
# whisperX declares conflicting PyTorch indexes (cpu vs cu128); override to use default PyPI
override-dependencies = [
    "torch>=2.8.0,<2.9",
    "torchaudio>=2.8.0,<2.9",
]

[[tool.uv.index]]
# Mirrors whisperX main's own index routing: native Windows resolves torch from cu128, not the CPU PyPI wheel.
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
whisperx = { git = "https://github.com/m-bain/whisperX.git" }
# Marker-gated so Linux/WSL and macOS resolution is unchanged.
torch = { index = "pytorch", marker = "sys_platform == 'win32'" }
torchaudio = { index = "pytorch", marker = "sys_platform == 'win32'" }

[project.scripts]
transcribe = "scripts.transcribe:main"
diarize = "scripts.diarize:main"
